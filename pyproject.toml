[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-python"
version = "0.1.0"
description = "A small resume-to-job workflow for learning Python LangGraph"
requires-python = ">=3.12,<3.13"
dependencies = ["langgraph==1.2.19", "langgraph-checkpoint-sqlite==3.1.3", "mcp==1.30.0", "httpx==0.28.1", "python-dotenv==1.2.4", "pydantic==2.14.2"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
